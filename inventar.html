<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Inventar</title>
<style>
:root{--gold-bright:#ffd95a;--cream:#fff7e0;--muted:#9bc2b0;
  --goldgrad:linear-gradient(135deg,#fff6c9 0%,#ffd95a 22%,#b07d10 48%,#ffe58a 72%,#a8740c 100%);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;color:var(--cream);min-height:100vh;padding:16px 10px 40px;overflow-x:hidden;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='%23ffd95a' fill-opacity='0.09' font-size='28' font-family='Arial'><text x='10' y='36'>♠</text><text x='70' y='36' fill='%23ff6b6b'>♥</text><text x='40' y='96' fill='%23ff6b6b'>♦</text><text x='100' y='96'>♣</text></g></svg>"),
    radial-gradient(ellipse at 50% -10%,#24916a 0%,rgba(36,145,106,0) 55%),
    radial-gradient(ellipse at 50% 115%,#000 0%,rgba(0,0,0,0) 55%),
    radial-gradient(circle at 0% 40%,rgba(255,217,90,0.14),rgba(255,217,90,0) 35%),
    radial-gradient(circle at 100% 70%,rgba(224,49,58,0.16),rgba(224,49,58,0) 35%),
    linear-gradient(180deg,#0f3a2a,#06180f);
  background-attachment:fixed}
body::after{content:"";position:fixed;inset:3px;border:7px double #ffd95a;border-radius:24px;pointer-events:none;z-index:50;
  box-shadow:0 0 0 2px #5a3d05,inset 0 0 0 2px #5a3d05,inset 0 0 36px rgba(255,217,90,0.25),0 0 22px rgba(0,0,0,0.6)}
.wrap{max-width:480px;margin:0 auto;padding:6px 8px}

.coin{display:inline-block;position:relative;width:1.2em;height:1.2em;border-radius:50%;vertical-align:-0.22em;flex:none;
  background:radial-gradient(circle at 32% 26%,#fffbe0 0%,#ffe27a 26%,#e8a912 60%,#8a5a05 100%);border:0.09em solid #b07d10;
  box-shadow:inset 0 0 0 0.07em #ffd95a,inset 0 -0.14em 0.18em rgba(90,61,5,0.65),0 0.1em 0.2em rgba(0,0,0,0.55),0 0 0.5em rgba(255,217,90,0.5);
  animation:cg 2.6s ease-in-out infinite}
.coin::before{content:"D";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:0.66em;color:#8a5a05;text-shadow:0 0.06em 0 #fff3b0}
.coin::after{content:"";position:absolute;top:12%;left:18%;width:30%;height:18%;border-radius:50%;background:rgba(255,255,255,0.75);transform:rotate(-30deg)}
@keyframes cg{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}

.top{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.back{padding:11px 12px;border:3px solid #ffd95a;border-radius:14px;color:var(--cream);font-weight:800;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;
  background:linear-gradient(180deg,#2f8d68,#1a6a4a);box-shadow:0 0 0 2px #4a3204,0 4px 0 #07301f}
.back:active{transform:translateY(3px);box-shadow:0 0 0 2px #4a3204,0 1px 0 #07301f}
.pill{flex:1;text-align:center;padding:10px 6px;border-radius:14px;font-weight:800;font-size:15px;color:var(--gold-bright);border:3px solid transparent;
  background:linear-gradient(180deg,#0a241a,#13422f) padding-box,var(--goldgrad) border-box;box-shadow:inset 0 3px 8px rgba(0,0,0,0.55),0 3px 0 #4a3204;text-shadow:0 2px 0 #5a3d05}
.title{text-align:center;font-family:'Playfair Display',serif;font-weight:900;font-size:34px;letter-spacing:1px;margin-bottom:14px;
  background:linear-gradient(180deg,#fff6c9 0%,#ffd95a 45%,#b07d10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #5a3d05) drop-shadow(0 8px 10px rgba(0,0,0,0.6))}

/* HOZIR TANLANGAN */
.now{position:relative;margin:0 0 20px;border-radius:20px;padding:16px 12px 12px;text-align:center;border:5px solid transparent;
  background:linear-gradient(180deg,#15573f,#082a1d) padding-box,var(--goldgrad) border-box;
  box-shadow:0 0 0 2px #4a3204,0 12px 22px rgba(0,0,0,0.55),inset 0 0 26px rgba(255,217,90,0.12)}
.now::before{content:"";position:absolute;inset:2px;border:1.5px solid rgba(255,217,90,0.55);border-radius:14px;pointer-events:none}
.now .lbl{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--gold-bright);margin-bottom:10px;text-shadow:0 2px 0 #5a3d05}
.stage{position:relative;height:130px;border-radius:14px;border:3px solid #ffd95a;box-shadow:0 0 0 2px #4a3204,inset 0 0 26px rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,#1f7a56,#0a241a)}
.stage .big{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;border:4px solid #ffd95a;
  background:radial-gradient(circle at 35% 30%,#2f8d68,#0a241a);box-shadow:0 0 0 2px #4a3204,0 8px 12px rgba(0,0,0,0.55),0 0 20px rgba(255,217,90,0.5);animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:12px 2px;border-radius:13px;font-size:13px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;color:var(--muted);
  border:3px solid rgba(255,217,90,0.35);background:linear-gradient(180deg,#0a241a,#13422f);box-shadow:inset 0 3px 6px rgba(0,0,0,0.5)}
.tabs button.on{color:#3a2a00;border-color:#fff3b0;background:linear-gradient(180deg,#fff08a,#e8a912);box-shadow:0 0 0 2px #6e4604,0 4px 0 #6e4604,inset 0 1px 0 rgba(255,255,255,0.7)}

.g{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.c{position:relative;border-radius:20px;padding:14px 8px 12px;text-align:center;border:5px solid transparent;
  background:linear-gradient(180deg,#15573f,#082a1d) padding-box,var(--goldgrad) border-box;
  box-shadow:0 0 0 2px #4a3204,0 12px 20px rgba(0,0,0,0.55),inset 0 0 22px rgba(255,217,90,0.12)}
.c::before{content:"";position:absolute;inset:2px;border:1.5px solid rgba(255,217,90,0.5);border-radius:14px;pointer-events:none}
.c.r-rare{background:linear-gradient(180deg,#15573f,#082a1d) padding-box,linear-gradient(135deg,#bfe9ff,#38bdf8,#1e6fb0,#bfe9ff) border-box}
.c.r-epic{background:linear-gradient(180deg,#15573f,#082a1d) padding-box,linear-gradient(135deg,#ecd0ff,#b06bff,#6a28b8,#ecd0ff) border-box}
.c.r-legend{background:linear-gradient(180deg,#15573f,#082a1d) padding-box,linear-gradient(135deg,#fff6c9,#ffb300,#ff6a00,#fff6c9) border-box;animation:lg 2s ease-in-out infinite}
@keyframes lg{0%,100%{box-shadow:0 0 0 2px #4a3204,0 12px 20px rgba(0,0,0,0.55),0 0 10px rgba(255,179,0,0.4)}50%{box-shadow:0 0 0 2px #4a3204,0 12px 20px rgba(0,0,0,0.55),0 0 26px rgba(255,179,0,0.95)}}
.c.sel{box-shadow:0 0 0 2px #4a3204,0 12px 20px rgba(0,0,0,0.55),0 0 22px rgba(79,227,138,0.8)}
.pvbox{position:relative;height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.aura{position:absolute;width:76px;height:76px;border-radius:50%;filter:blur(14px);opacity:.5;
  background:conic-gradient(from 0deg,#ff4f5a,#ffb347,#fff35a,#4fe38a,#4aa3ff,#b06bff,#ff4f5a);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.av{position:relative;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;border:4px solid #ffd95a;
  background:radial-gradient(circle at 35% 30%,#2f8d68,#0a241a);box-shadow:0 0 0 2px #4a3204,0 6px 10px rgba(0,0,0,0.5);animation:bob 3s ease-in-out infinite}
.bgp{width:100%;height:80px;border-radius:14px;border:3px solid #ffd95a;box-shadow:0 0 0 2px #4a3204,inset 0 0 18px rgba(0,0,0,0.35)}
.name{font-weight:800;font-size:15px;margin:2px 0 8px;text-shadow:0 2px 0 rgba(0,0,0,0.5)}
.c button{width:100%;padding:12px 6px;border-radius:14px;font-size:14px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;color:#3a2a00;position:relative;overflow:hidden;
  border:3px solid #fff3b0;background:linear-gradient(180deg,#fff08a 0%,#ffc933 48%,#e09a0c 52%,#f6b81e 100%);text-shadow:0 1px 0 rgba(255,255,255,0.5);
  box-shadow:0 0 0 2px #6e4604,0 5px 0 #6e4604,0 9px 12px rgba(0,0,0,0.5),inset 0 2px 0 rgba(255,255,255,0.8)}
.c button:active{transform:translateY(4px);box-shadow:0 0 0 2px #6e4604,0 1px 0 #6e4604,inset 0 2px 0 rgba(255,255,255,0.8)}
.c button.sel{color:var(--cream);text-shadow:0 2px 0 rgba(0,0,0,0.5);border-color:#ffd95a;background:linear-gradient(180deg,#3fae86,#146141);box-shadow:0 0 0 2px #4a3204,0 5px 0 #07301f,inset 0 2px 0 rgba(255,255,255,0.4)}

.empty{grid-column:span 2;text-align:center;color:var(--muted);padding:24px 10px;font-weight:600;line-height:1.6}
.empty svg{width:120px;height:104px;margin-bottom:10px;filter:drop-shadow(0 8px 6px rgba(0,0,0,0.55))}
.shopbtn{display:block;margin:24px auto 0;width:100%;padding:17px;border-radius:20px;font-size:17px;font-weight:800;font-family:'Inter',sans-serif;cursor:pointer;color:#3a2a00;
  border:4px solid #fff3b0;background:linear-gradient(180deg,#fff08a 0%,#ffc933 48%,#e09a0c 52%,#f6b81e 100%);text-shadow:0 1px 0 rgba(255,255,255,0.5);
  box-shadow:0 0 0 2px #6e4604,0 8px 0 #6e4604,0 16px 22px rgba(0,0,0,0.6),inset 0 2px 0 rgba(255,255,255,0.8)}
.shopbtn:active{transform:translateY(6px);box-shadow:0 0 0 2px #6e4604,0 2px 0 #6e4604,inset 0 2px 0 rgba(255,255,255,0.8)}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6c9"/><stop offset=".35" stop-color="#ffd95a"/><stop offset=".7" stop-color="#b07d10"/><stop offset="1" stop-color="#ffe58a"/></linearGradient>
  <linearGradient id="b0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c0703a"/><stop offset="1" stop-color="#5a2d0c"/></linearGradient>
</defs></svg>

<div class="wrap">
  <div class="top"><button class="back" onclick="location.href='index.html'">← Orqaga</button><span class="pill" id="bal"></span><span class="pill" id="pts"></span></div>
  <div class="title">INVENTAR</div>
  <div id="now"></div>
  <div class="tabs" id="tabs"></div>
  <div class="g" id="g"><div class="empty">Yuklanmoqda...</div></div>
  <button class="shopbtn" onclick="location.href='shop.html'">🛒 Do'konga o'tish</button>
</div>

<script>
const API="https://durak-bot-0stf.onrender.com/api/shop/",tg=Telegram.WebApp;
tg.ready();tg.expand();tg.BackButton.show();tg.BackButton.onClick(()=>{location.href="index.html"});
let D,tab="av";
const COIN='<span class="coin"></span>';
const T={av:"🧑 Avatarlar",bg:"🖼 Fonlar"};
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('en-US').replace(/,/g,' ');
async function post(p,x={}){
  const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({initData:tg.initData,...x})});return r.json()}
async function load(){D=await post("me");if(D.error)return tg.showAlert(D.error);draw()}

const EMPTY_CHEST=`<svg viewBox="0 0 120 104"><rect x="20" y="50" width="80" height="42" rx="6" fill="url(#b0)" stroke="#5a3d05" stroke-width="2"/><rect x="32" y="50" width="9" height="42" fill="url(#gold)" stroke="#8a5a05"/><rect x="79" y="50" width="9" height="42" fill="url(#gold)" stroke="#8a5a05"/><path d="M20 52 Q20 28 60 28 Q100 28 100 52 Z" fill="url(#b0)" stroke="#5a3d05" stroke-width="2"/><rect x="17" y="48" width="86" height="8" rx="4" fill="url(#gold)" stroke="#8a5a05"/><circle cx="60" cy="68" r="9" fill="url(#gold)" stroke="#8a5a05" stroke-width="1.5"/><circle cx="60" cy="66" r="2.6" fill="#3a2a00"/><rect x="58.7" y="66" width="2.6" height="7" fill="#3a2a00"/></svg>`;

function draw(){
  document.getElementById("bal").innerHTML=COIN+" "+fmt(D.balance);
  document.getElementById("pts").textContent="🏆 "+fmt(D.points);
  const cnt=t=>D.items.filter(i=>i.t==t&&D.owned.includes(i.id)).length;
  document.getElementById("tabs").innerHTML=Object.keys(T).map(k=>
    `<button class="${k==tab?"on":""}" onclick="tab='${k}';draw()">${T[k]} (${cnt(k)})</button>`).join("");

  const curAv=D.items.find(i=>i.id==D.avatar),curBg=D.items.find(i=>i.id==D.bg);
  document.getElementById("now").innerHTML=`<div class="now"><div class="lbl">HOZIR TANLANGAN</div>
    <div class="stage" style="${curBg?`background:linear-gradient(135deg,${curBg.v})`:""}"><div class="big">${curAv?curAv.v:"🙂"}</div></div></div>`;

  const list=D.items.filter(i=>i.t==tab&&D.owned.includes(i.id));
  let h=list.map(i=>{
    const on=D[i.t=="av"?"avatar":"bg"]==i.id;
    const pv=i.t=="av"?`<div class="pvbox"><div class="aura"></div><div class="av">${i.v}</div></div>`
      :`<div class="pvbox"><div class="bgp" style="background:linear-gradient(135deg,${i.v})"></div></div>`;
    return `<div class="c r-${i.r}${on?" sel":""}">${pv}<div class="name">${i.n}</div><button class="${on?"sel":""}" onclick="equip('${i.id}')">${on?"✓ Tanlangan":"Tanlash"}</button></div>`}).join("");
  if(!h)h=`<div class="empty">${EMPTY_CHEST}<br>Hozircha hech narsa yo'q.<br>Do'kondan sotib oling!</div>`;
  document.getElementById("g").innerHTML=h}

async function equip(id){
  const r=await post("equip",{id});
  if(r.error)return tg.showAlert(r.error);
  load()}
load();
</script></body></html>
