<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Inventar</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:10px}
.back{padding:6px 10px;border:0;border-radius:8px;background:#1e293b;color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:8px 2px;border:0;border-radius:8px;background:#1e293b;color:#fff}
.tabs .on{background:#2563eb}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.c{background:#1e293b;border-radius:10px;padding:10px;text-align:center;border:1px solid #334155}
.pv{height:50px;border-radius:8px;margin-bottom:6px;font-size:34px;line-height:50px}
.c button{width:100%;padding:7px;border:0;border-radius:8px;background:#16a34a;color:#fff;margin-top:6px}
.c .sel{background:#475569}
.r-rare{border-color:#38bdf8}.r-legend{border-color:#fbbf24}
.empty{grid-column:1/3;text-align:center;color:#94a3b8;padding:30px 10px}
.shopbtn{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:#2563eb;color:#fff}
</style></head><body>
<div class="top"><button class="back" onclick="location.href='index.html'">← Orqaga</button><span id="bal"></span><span id="pts"></span></div>
<div class="tabs" id="tabs"></div><div class="g" id="g"></div>
<button class="shopbtn" onclick="location.href='shop.html'">🛒 Do'konga o'tish</button>
<script>
const API="https://durak-bot-0stf.onrender.com/api/shop/",tg=Telegram.WebApp;
tg.ready();tg.expand();tg.BackButton.show();tg.BackButton.onClick(()=>{location.href="index.html"});
let D,tab="av";
const T={av:"🧑 Avatarlar",bg:"🖼 Fonlar"};
async function post(p,x={}){
  const r=await fetch(API+p,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({initData:tg.initData,...x})});return r.json()}
async function load(){D=await post("me");if(D.error)return tg.showAlert(D.error);draw()}
function draw(){
  document.getElementById("bal").textContent="💰 "+D.balance;
  document.getElementById("pts").textContent="🏆 "+Math.floor(D.points);
  document.getElementById("tabs").innerHTML=Object.keys(T).map(k=>
    `<button class="${k==tab?"on":""}" onclick="tab='${k}';draw()">${T[k]}</button>`).join("");
  const list=D.items.filter(i=>i.t==tab&&D.owned.includes(i.id));
  let h=list.map(i=>{
    const on=D[i.t=="av"?"avatar":"bg"]==i.id;
    const pv=i.t=="av"?`<div class="pv">${i.v}</div>`:`<div class="pv" style="background:linear-gradient(135deg,${i.v})"></div>`;
    return `<div class="c r-${i.r}">${pv}<div>${i.n}</div><button class="${on?"sel":""}" onclick="equip('${i.id}')">${on?"✓ Tanlangan":"Tanlash"}</button></div>`}).join("");
  if(!h)h=`<div class="empty">Hozircha hech narsa yo'q.<br>Do'kondan sotib oling!</div>`;
  document.getElementById("g").innerHTML=h}
async function equip(id){
  const r=await post("equip",{id});
  if(r.error)return tg.showAlert(r.error);
  load()}
load();
</script></body></html>
