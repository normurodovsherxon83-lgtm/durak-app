<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Durak Online</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --felt-deep:#081c15;
    --felt:#0e2e22;
    --felt-light:#123d2c;
    --gold:#c9a227;
    --gold-bright:#e6c34a;
    --red:#b3242a;
    --cream:#f2ecdd;
    --muted:#8fa79a;
    --card-bg:#102a20;
    --border:rgba(201,162,39,0.28);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(ellipse at top, var(--felt-light) 0%, var(--felt) 45%, var(--felt-deep) 100%);
    color:var(--cream);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:78px;
  }

  /* Hero */
  .hero{
    padding:36px 24px 20px;
    text-align:center;
    position:relative;
  }
  .suit-row{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
    opacity:0.85;
  }
  .suit-row svg{width:16px;height:16px;}
  .brand{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:44px;
    letter-spacing:1px;
    line-height:1;
  }
  .brand .accent{color:var(--red);}
  .tagline{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:0.5px;
  }

  .card-illustration{
    margin:22px auto 6px;
    width:150px;
    height:150px;
  }

  /* Primary CTA */
  .cta-wrap{
    padding:8px 24px 0;
  }
  .cta{
    width:100%;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#2b2205;
    border:none;
    border-radius:14px;
    padding:18px;
    font-size:17px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 6px 0 #8a6f16, 0 10px 18px rgba(0,0,0,0.35);
    cursor:pointer;
    transition:transform .08s ease;
  }
  .cta:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6f16,0 4px 10px rgba(0,0,0,0.3);}
  .cta-sub{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:8px;
  }

  /* Secondary actions */
  .secondary-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:16px 24px 0;
  }
  .secondary-card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    text-align:left;
    cursor:pointer;
  }
  .secondary-card .icon{font-size:20px;margin-bottom:6px;display:block;}
  .secondary-card .title{font-size:14px;font-weight:600;}
  .secondary-card .desc{font-size:11px;color:var(--muted);margin-top:2px;}

  /* Bot difficulty strip */
  .bots-strip{
    margin:20px 24px 0;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
  }
  .bots-strip .head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
  }
  .bots-strip .head .title{font-size:14px;font-weight:600;}
  .bots-strip .head .balance{font-size:12px;color:var(--gold-bright);font-weight:600;}
  .levels{display:flex;gap:8px;}
  .level-btn{
    flex:1;
    background:var(--felt-light);
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 6px;
    text-align:center;
    font-size:12px;
    font-weight:600;
    color:var(--cream);
    cursor:pointer;
  }
  .level-btn.locked{color:var(--muted);opacity:0.55;}
  .level-btn .stars{display:block;font-size:10px;color:var(--gold);margin-top:3px;font-weight:400;}

  /* Bottom nav */
  .bottom-nav{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;
    margin:0 auto;
    background:rgba(8,28,21,0.96);
    border-top:1px solid var(--border);
    display:flex;
    padding:10px 8px 14px;
    backdrop-filter:blur(6px);
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    color:var(--muted);
    font-size:10px;
    cursor:pointer;
  }
  .nav-item.active{color:var(--gold-bright);}
  .nav-item .ic{font-size:19px;line-height:1;}

  .toast{
    position:fixed;
    bottom:92px;left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--felt-light);
    border:1px solid var(--border);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <div class="hero">
    <div class="suit-row" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="#b3242a"><path d="M12 2C9 8 3 10 3 15a5 5 0 0010 2 5 5 0 0010-2c0-5-6-7-9-13z"/></svg>
      <svg viewBox="0 0 24 24" fill="#f2ecdd"><path d="M12 21s-7-4.35-9.5-8.5C.7 8.9 2.6 5 6.2 5c2 0 3.4 1 4.8 3 1.4-2 2.8-3 4.8-3 3.6 0 5.5 3.9 3.7 7.5C19 16.65 12 21 12 21z"/></svg>
      <svg viewBox="0 0 24 24" fill="#b3242a"><path d="M12 2l2.6 6.6L21 11l-6.4 2.4L12 20l-2.6-6.6L3 11l6.4-2.4z"/></svg>
      <svg viewBox="0 0 24 24" fill="#f2ecdd"><path d="M12 2C6 2 2 6.5 2 11c0 4 3 6 6 6-1 3-3 4-3 4h14s-2-1-3-4c3 0 6-2 6-6 0-4.5-4-9-10-9z"/></svg>
    </div>
    <div class="brand">DURAK<span class="accent">.</span>UZ</div>
    <div class="tagline">Do'stlar bilan onlayn karta o'yini</div>

    <svg class="card-illustration" viewBox="0 0 150 150" aria-hidden="true">
      <g transform="translate(75,75)">
        <rect x="-38" y="-52" width="62" height="86" rx="8" transform="rotate(-12)" fill="#f2ecdd" stroke="#0e2e22" stroke-width="1"/>
        <rect x="-24" y="-43" width="62" height="86" rx="8" fill="#f2ecdd" stroke="#c9a227" stroke-width="1.5"/>
        <text x="-14" y="-24" font-family="Playfair Display, serif" font-size="18" font-weight="700" fill="#b3242a">A</text>
        <path d="M-4 -14 c-6 -6 -14 0 -8 8 4 5 8 8 8 8 s4 -3 8 -8 c6 -8 -2 -14 -8 -8z" fill="#b3242a"/>
      </g>
    </svg>
  </div>

  <div class="cta-wrap">
    <button class="cta" onclick="joinGame()">
      <span>🎮</span> O'yinga qo'shilish
    </button>
    <div class="cta-sub">Tasodifiy raqib yoki do'stni taklif qiling</div>
  </div>

  <div class="secondary-grid">
    <div class="secondary-card" onclick="showToast('Reyting tez orada')">
      <span class="icon">🏆</span>
      <div class="title">Reyting</div>
      <div class="desc">Eng kuchli o'yinchilar</div>
    </div>
    <div class="secondary-card" onclick="showToast('Do\'kon tez orada')">
      <span class="icon">💰</span>
      <div class="title">Do'kon</div>
      <div class="desc">Stars orqali xarid</div>
    </div>
  </div>

  <div class="bots-strip">
    <div class="head">
      <span class="title">🤖 Botlarga qarshi o'ynash</span>
      <span class="balance">4 000 💰</span>
    </div>
    <div class="levels">
      <div class="level-btn" onclick="showToast('Oson daraja — tez orada')">Oson<span class="stars">+ko'p pul</span></div>
      <div class="level-btn locked" onclick="showToast('5-daraja yutib oching')">O'rta<span class="stars">🔒 5-daraja</span></div>
      <div class="level-btn locked" onclick="showToast('12-daraja yutib oching')">Qiyin<span class="stars">🔒 12-daraja</span></div>
    </div>
  </div>

</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="setActive(this)"><span class="ic">🎮</span>O'yin</div>
  <div class="nav-item" onclick="setActive(this)"><span class="ic">🤖</span>Botlar</div>
  <div class="nav-item" onclick="setActive(this)"><span class="ic">🏆</span>Reyting</div>
  <div class="nav-item" onclick="setActive(this)"><span class="ic">💰</span>Do'kon</div>
</div>

<div class="toast" id="toast"></div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function joinGame(){
    showToast('O\'yin qidirilmoqda... (bu qism keyingi bosqichda ulanadi)');
  }

  function setActive(el){
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    el.classList.add('active');
    showToast(el.textContent.trim() + ' bo\'limi');
  }
</script>
</body>
</html>
